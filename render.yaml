# Existing Render service was created manually. This is its declarative reference;
# do not create a duplicate service by importing a new Blueprint.
services:
  - type: web
    name: rmc-web-solutions-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.15.0
# Later: set CLIENT_ORIGIN=https://retailmediacenter.com on the existing
# service, once the React frontend is actually published on Webglobe.
